name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib

    steps:
      - uses: actions/checkout@v5

      - name: Download generator
        run: |
          git clone --depth 1 \
            https://github.com/yoshi389111/github-profile-3d-contrib.git \
            "$RUNNER_TEMP/profile-3d-generator"

      - name: Set period from February 2026
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = (
              Path(os.environ["RUNNER_TEMP"])
              / "profile-3d-generator"
              / "src"
              / "github-graphql.ts"
          )

          text = path.read_text(encoding="utf-8")

          start_marker = "    const yearArgs = year"
          end_marker = "    const headers = {"

          start = text.find(start_marker)
          end = text.find(end_marker, start)

          if start == -1 or end == -1:
              print("github-graphql.ts에서 날짜 코드 위치를 찾지 못했습니다.")
              print("const yearArgs 위치:", text.find("const yearArgs"))
              raise RuntimeError("날짜 설정 코드 치환 실패")

          replacement = '''    const yearArgs =
              `(from:"2026-02-01T00:00:00.000Z", to:"${new Date().toISOString()}")`;

          '''

          updated = text[:start] + replacement + text[end:]
          path.write_text(updated, encoding="utf-8")

          print("기여도 조회 기간을 2026-02-01부터 현재 날짜까지로 변경했습니다.")
          PY

      - name: Build generator
        working-directory: ${{ runner.temp }}/profile-3d-generator
        run: |
          npm ci
          npx tsc
          test -f dist0/src/index.js

      - name: Generate profile image
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          node "$RUNNER_TEMP/profile-3d-generator"

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib

          if git diff --cached --quiet; then
            echo "변경된 이미지가 없습니다."
          else
            git commit -m "generated"
            git push
          fi
